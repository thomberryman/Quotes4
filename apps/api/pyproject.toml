[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotes4-api"
version = "0.1.0"
description = "FastAPI backend for Quotes4."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
