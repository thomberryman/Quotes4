[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotes4-worker"
version = "0.1.0"
description = "Background worker for Quotes4 imports, parsing, and recalculation."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
