services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      API_PORT: 3001
      API_BASE_PATH: /api/v1
      DATABASE_URL: postgresql://quotes4:quotes4@postgres:5432/quotes4
      APP_BASE_URL: http://web:3000
      API_BASE_URL: http://api:3001
      WEB_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_INVITE_SECRET: replace-me
      WORKER_CALLBACK_TOKEN: quotes4-worker-token
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-2
      S3_BUCKET: quotes4-assets
      S3_ACCESS_KEY: quotes4
      S3_SECRET_KEY: quotes4-secret
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/quotes4-assets
      MAILER_MODE: log
      MAILER_FROM_ADDRESS: no-reply@quotes4.local
      MAILER_BASE_URL: http://mailpit:8025
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - minio
      - mailpit

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://quotes4:quotes4@postgres:5432/quotes4
      WORKER_NAME: quotes4-worker
      API_BASE_URL: http://api:3001
      API_BASE_PATH: /api/v1
      WORKER_CALLBACK_TOKEN: quotes4-worker-token
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: quotes4-assets
      WORKER_POLL_INTERVAL_SECONDS: 5
      WORKER_RUN_FOREVER: "true"
    depends_on:
      - postgres
      - api

  postgres:
    image: postgres:16-alpine
    container_name: quotes4-postgres
    environment:
      POSTGRES_DB: quotes4
      POSTGRES_USER: quotes4
      POSTGRES_PASSWORD: quotes4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: quotes4-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quotes4
      MINIO_ROOT_PASSWORD: quotes4-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: quotes4-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
