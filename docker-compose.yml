services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PUBLIC_PORT:-3001}
      NEXT_PUBLIC_APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Quotes4 Demo}
      NEXT_PUBLIC_WORKSPACE_LABEL: ${WORKSPACE_LABEL:-Demo Workspace}
      NEXT_PUBLIC_WORKSPACE_DESCRIPTION: ${WORKSPACE_DESCRIPTION:-Seeded quotes, forecasts, imports, and benchmark records are available for walkthroughs and workflow testing.}
      NEXT_PUBLIC_DATA_MODE: ${DATA_MODE:-demo}
      NEXT_PUBLIC_AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-quotes4_access_token}
      NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-quotes4_csrf_token}
      NODE_ENV: development
    ports:
      - "${WEB_PUBLIC_PORT:-3000}:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 3001
      API_BASE_PATH: /api/v1
      DATABASE_URL: postgresql://quotes4:quotes4@postgres:5432/${POSTGRES_DB:-quotes4}
      SEED_MODE: ${SEED_MODE:-demo}
      APP_BASE_URL: ${WEB_ORIGIN:-http://localhost:3000}
      API_BASE_URL: http://localhost:${API_PUBLIC_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_INVITE_SECRET: ${AUTH_INVITE_SECRET:-replace-me}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-replace-me}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-quotes4_access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-quotes4_refresh_token}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-quotes4_csrf_token}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@quotes4.dev}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-quotes4-admin-password}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-quotes4-worker-token}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-eu-west-2}
      S3_BUCKET: ${S3_BUCKET:-quotes4-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quotes4}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quotes4-secret}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/quotes4-assets}
      MAILER_MODE: ${MAILER_MODE:-log}
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS:-no-reply@quotes4.local}
      MAILER_BASE_URL: http://mailpit:8025
    ports:
      - "${API_PUBLIC_PORT:-3001}:3001"
    depends_on:
      - postgres
      - minio
      - mailpit

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://quotes4:quotes4@postgres:5432/${POSTGRES_DB:-quotes4}
      WORKER_NAME: quotes4-worker
      API_BASE_URL: http://api:3001
      API_BASE_PATH: /api/v1
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-quotes4-worker-token}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-quotes4-assets}
      WORKER_POLL_INTERVAL_SECONDS: 5
      WORKER_RUN_FOREVER: "true"
    depends_on:
      - postgres
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotes4}
      POSTGRES_USER: quotes4
      POSTGRES_PASSWORD: quotes4
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-quotes4}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-quotes4-secret}
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PUBLIC_PORT:-1025}:1025"
      - "${MAILPIT_PUBLIC_PORT:-8025}:8025"

volumes:
  postgres-data:
  minio-data:
